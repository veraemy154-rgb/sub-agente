name: Evidencia mensual

# El dia 1 de cada mes: escanea todos los clientes, compara contra el estado
# guardado y genera informe de evidencia + factura por cada uno.
# Esto es lo que hace que el retainer no dependa de que tu te acuerdes.

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      periodo:
        description: 'Periodo YYYY-MM (vacio = mes actual)'
        required: false
      facturar:
        description: 'Generar tambien las facturas'
        required: false
        default: 'true'

jobs:
  evidencia:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restaurar estado de hallazgos
        uses: actions/cache@v4
        with:
          path: out/estado
          key: estado-evidencia-${{ github.run_id }}
          restore-keys: estado-evidencia-

      - run: pip install -r requirements.txt -q

      - name: Generar informes y facturas
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ inputs.periodo }}" ] && ARGS="--periodo ${{ inputs.periodo }}"
          [ "${{ inputs.facturar }}" = "false" ] && ARGS="$ARGS --no-facturar"
          python scripts/evidencia_mensual.py $ARGS --delay 1.5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-${{ inputs.periodo || 'mes-actual' }}
          path: |
            out/evidencia/
            out/facturas/
            out/estado/
          if-no-files-found: warn

      - name: Persistir estado
        if: always()
        run: |
          git config user.name "bot-evidencia"
          git config user.email "bot@users.noreply.github.com"
          git add out/estado || true
          if git diff --quiet --cached; then
            echo "Sin cambios en el estado"
          else
            git commit -m "chore(evidencia): estado de hallazgos ${{ inputs.periodo }}"
            git push
          fi
